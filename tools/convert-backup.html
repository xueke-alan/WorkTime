</head><body><main><h1>工作记录备份转换</h1><p>将版本 1 或 2 的 JSON 或压缩文本备份转换为版本 3。转换仅在内存中进行，下载为新文件，不读取或覆盖浏览器记录，不修改原备份。</p>
<label for="backupInputFile">选择旧备份</label><input id="backupInputFile" type="file" accept=".json,.txt,application/json,text/plain">
<label for="backupInput">或粘贴备份文本</label><textarea id="backupInput" rows="8" spellcheck="false"></textarea>
<button id="convert" type="button">转换备份</button><p id="status" role="status" aria-live="polite"></p>
<label for="backupOutput">新版备份</label><textarea id="backupOutput" rows="8" readonly spellcheck="false"></textarea>
<button id="download" type="button" disabled>下载新版备份</button><p>下载后返回<a href="../index.html">工作记录页面</a>，使用“恢复”导入新版备份。请保留旧文件直至核对记录、排班及导入历史。</p></main></body></html>
