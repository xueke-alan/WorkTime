name: Baidu weather

# The single concurrency block below permissions preserves serialized writes.
# Removed only the duplicate block; group and cancellation policy are unchanged.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/weather.yml
      - scripts/fetch_weather.py
      - assets/data/weather-locations.json
permissions:
  contents: write
concurrency:
  group: baidu-weather
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check collector syntax
        run: python -m py_compile scripts/fetch_weather.py
      - name: Fetch office weather
        id: weather
        env:
          BAIDU_MAP_AK: ${{ secrets.BAIDU_MAP_AK }}
        run: python scripts/fetch_weather.py
      - name: Commit weather snapshot
        if: steps.weather.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/weather.json
          if git diff --cached --quiet; then
            echo 'Upstream weather unchanged; snapshot retained.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m 'Update Baidu city weather'
          for attempt in 1 2 3; do
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              echo 'Ten office cities updated from Baidu.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH" || { git rebase --abort; exit 1; }
            sleep "$((attempt * 2))"
          done
