name: Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_run:
    workflows: [Baidu weather]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-and-weather
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: npm ci
      - name: Code and data quality gate
        run: npm run check && npm run lint && npm run check:format
      - name: Install offline browser
        run: npx playwright install --with-deps chromium
      - name: Verify offline entry
        env:
          WORKTIME_BROWSER_CHANNEL: chromium
        run: node scripts/verify-offline.cjs
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html _site/
          cp -R assets licenses _site/
          cp -R tools _site/
          if [ -d data ]; then cp -R data _site/; fi
          node scripts/bundle-site.cjs _site
          node scripts/version-site.cjs _site
          touch _site/.nojekyll
      - name: Verify published startup
        env:
          WORKTIME_BROWSER_CHANNEL: chromium
        run: node scripts/verify-startup.cjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
