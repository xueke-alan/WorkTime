name: Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_run:
    workflows: [Baidu weather]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-and-weather
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Full source and published-site checks run locally in the pre-push hook.
      # Preparing the static site uses only Node's built-in modules.
      - name: Prepare site
        run: node scripts/prepare-site.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
